<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — E-Learning Platform</title>
    <meta name="description" content="Sign in to your e-learning account.">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="public-page">
    <div class="public-container">
        <h1>E-Learning Platform</h1>
        <div class="form-box">
            <h2>Welcome Back</h2>
            <p class="form-subtitle">Sign in to enter your learning portal</p>
            <form id="loginForm">
                <input type="email"    id="email"    placeholder="Email Address"  required autocomplete="email">
                <input type="password" id="password" placeholder="Password"       required autocomplete="current-password">
                <button type="submit"  id="submitBtn">Sign In</button>
            </form>
            <p id="message" class="form-message"></p>
            <div class="form-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
        <div class="back-home"><a href="index.html">&larr; Back to Home</a></div>
    </div>
    <script src="js/login.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
